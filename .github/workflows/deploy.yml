# Builds the site and publishes a development preview to GitHub Pages on every push to main.
# Preview URL: https://aklepner.github.io/drlentau1/
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://aklepner.github.io
      SITE_BASE: /drlentau1
      PUBLIC_NOINDEX: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install (not npm ci) so Linux-only optional packages are fetched even if the lock file came from a Mac
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
